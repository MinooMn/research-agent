name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python -m pytest tests/unit -v
        env:
          # src modules import config.py, which raises at import time if this
          # is unset. The unit suite is pure logic and never calls the API.
          GROQ_API_KEY: dummy-ci-key
